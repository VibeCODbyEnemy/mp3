<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>iPod · фикс кнопок на заблокированном экране</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, 'SF Pro Text', Helvetica, sans-serif;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      padding-top: constant(safe-area-inset-top, 16px);
      padding-top: env(safe-area-inset-top, 16px);
      padding-bottom: constant(safe-area-inset-bottom, 16px);
      padding-bottom: env(safe-area-inset-bottom, 16px);
      padding-left: constant(safe-area-inset-left, 16px);
      padding-left: env(safe-area-inset-left, 16px);
      padding-right: constant(safe-area-inset-right, 16px);
      padding-right: env(safe-area-inset-right, 16px);
      background: #000;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('img/bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(12px);
      transform: scale(1.05);
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    .player-card {
      background: rgba(20, 22, 28, 0.85);
      backdrop-filter: blur(40px);
      border-radius: 48px;
      padding: 24px 20px 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .icon-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #ddd;
      padding: 8px;
      border-radius: 40px;
      transition: 0.1s;
    }
    .icon-btn:active { background: rgba(255,255,255,0.1); }

    .artwork {
      aspect-ratio: 1 / 1;
      width: 85%;
      margin: 0 auto 20px;
      border-radius: 24px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      background-size: cover;
      background-position: center;
      background-color: #2c2e36;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .track-info {
      text-align: center;
      margin: 16px 0 10px;
    }
    .track-name {
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 12px;
      font-size: 0.75rem;
      color: #bbb;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: #3a3e48;
      border-radius: 10px;
      cursor: pointer;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #fa6b6b;
      border-radius: 10px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin: 12px 0 10px;
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      width: 70px;
      height: 70px;
      border-radius: 70px;
      font-size: 2.2rem;
      cursor: pointer;
      color: white;
      transition: 0.1s;
    }
    .ctrl-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.2); }
    .play-btn { background: #fa6b6b; box-shadow: 0 8px 20px rgba(250, 107, 107, 0.3); }

    .dropdown {
      position: absolute;
      background: rgba(30, 32, 40, 0.98);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 100;
      display: none;
      flex-direction: column;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
    }
    .dropdown.show { display: flex; }

    .tracks-dropdown {
      left: 10px;
      top: 60px;
      width: 260px;
      max-height: 400px;
      overflow-y: auto;
      padding: 12px;
      gap: 8px;
    }
    .track-row {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .track-row.now { background: #fa6b6b80; }

    .settings-dropdown {
      right: 0;
      top: 60px;
      width: 500px;
      max-width: 90vw;
      padding: 18px;
      gap: 18px;
    }
    .playlist-track-panel {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 16px;
      min-height: 280px;
    }
    .playlist-side, .tracks-side {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 24px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .playlist-side h4, .tracks-side h4 {
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 10px;
    }
    .playlist-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pl-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .pl-item.active { background: #fa6b6b; color: white; }
    .pl-item button {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
    }
    .track-list-drop {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .small-btn {
      background: #2c6e9e;
      border: none;
      padding: 6px;
      border-radius: 40px;
      color: white;
      margin-top: 12px;
      font-size: 0.75rem;
      cursor: pointer;
      width: 100%;
    }
    .volume-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }
    .volume-slider { flex: 1; }
    .upload-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    @media (max-width: 560px) {
      .settings-dropdown { width: 96vw; right: -10px; }
      .playlist-track-panel { grid-template-columns: 1fr; gap: 12px; max-height: 400px; overflow-y: auto; }
      .ctrl-btn { width: 60px; height: 60px; font-size: 1.8rem; }
      .track-name { font-size: 1.3rem; }
    }
  </style>
</head>
<body oncontextmenu="return false">
<div class="player-card">
  <div class="top-bar">
    <button class="icon-btn" id="tracksListBtn">🎵</button>
    <button class="icon-btn" id="settingsBtn">⚙️</button>
  </div>

  <div id="tracksDropdown" class="dropdown tracks-dropdown"></div>
  <div id="settingsDropdown" class="dropdown settings-dropdown">
    <div class="playlist-track-panel">
      <div class="playlist-side">
        <h4>📀 Плейлисты</h4>
        <div id="playlistList" class="playlist-list"></div>
        <button id="newPlBtn" class="small-btn">+ Новый плейлист</button>
      </div>
      <div class="tracks-side">
        <h4>🎧 Треки в плейлисте</h4>
        <div id="trackDropdownList" class="track-list-drop"></div>
      </div>
    </div>
    <div class="volume-row">
      <span>🔊</span><input type="range" id="volumeCtl" min="0" max="1" step="0.01" value="0.8" class="volume-slider">
    </div>
    <div class="upload-row">
      <button id="uploadMusicBtn" class="small-btn" style="background:#3a5668">📁 Загрузить музыку</button>
      <button id="genManifestBtn" class="small-btn" style="background:#3a5668">📄 Создать manifest.json</button>
    </div>
    <input type="file" id="fileInput" multiple accept="audio/*,image/*" style="display:none">
  </div>

  <div class="artwork" id="artwork" style="background-image: none;"></div>
  <div class="track-info">
    <div class="track-name" id="currentTrackName">—</div>
  </div>
  <div class="progress-container">
    <span id="currentTimeLabel">0:00</span>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="totalDurationLabel">0:00</span>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn">⏮</button>
    <button class="ctrl-btn play-btn" id="playPauseBtn">▶</button>
    <button class="ctrl-btn" id="nextBtn">⏭</button>
  </div>
</div>

<script>
  (function() {
    // --- HTML5 Audio ---
    let audio = new Audio();
    audio.setAttribute('playsinline', '');
    audio.setAttribute('webkit-playsinline', '');
    let isPlaying = false;
    let tracks = [];
    let nextId = 1;
    let playlists = new Map([['default', { name: 'Основной', ids: [] }]]);
    let activePl = 'default', currentIdx = 0;
    let currentTrackId = null;
    let isSwitching = false;

    // DOM
    const playBtn = document.getElementById('playPauseBtn'), prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar'), fill = document.getElementById('progressFill');
    const curTimeSpan = document.getElementById('currentTimeLabel'), totalSpan = document.getElementById('totalDurationLabel');
    const trackNameSpan = document.getElementById('currentTrackName');
    const artworkDiv = document.getElementById('artwork');
    const volumeSlider = document.getElementById('volumeCtl');
    const tracksListBtn = document.getElementById('tracksListBtn'), settingsBtn = document.getElementById('settingsBtn');
    const tracksDropdown = document.getElementById('tracksDropdown');
    const settingsDropdown = document.getElementById('settingsDropdown');
    const playlistListDiv = document.getElementById('playlistList');
    const trackDropdownList = document.getElementById('trackDropdownList');
    const newPlBtn = document.getElementById('newPlBtn');
    const uploadBtn = document.getElementById('uploadMusicBtn'), fileInput = document.getElementById('fileInput');
    const genManifestBtn = document.getElementById('genManifestBtn');

    const DEFAULT_COVER = 'img/icon.png';

    function format(sec) {
      if (isNaN(sec)) return '0:00';
      let m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function setVolume(v) {
      audio.volume = v;
      localStorage.setItem('vol_set', v);
    }

    function updateArtworkDisplay(coverUrl) {
      if (coverUrl) {
        artworkDiv.style.backgroundImage = `url('${coverUrl}')`;
        artworkDiv.style.backgroundSize = 'cover';
        artworkDiv.innerHTML = '';
      } else {
        artworkDiv.style.backgroundImage = `url('${DEFAULT_COVER}')`;
        artworkDiv.style.backgroundSize = 'cover';
        artworkDiv.innerHTML = '';
      }
    }

    async function playCurrent() {
      let pl = playlists.get(activePl);
      if (!pl || !pl.ids.length) return;
      let track = tracks.find(t => t.id === pl.ids[currentIdx]);
      if (!track) return;

      if (currentTrackId === track.id && audio.src && !audio.paused) return;

      isSwitching = true;
      audio.pause();
      audio.src = track.url;
      audio.load();

      currentTrackId = track.id;
      trackNameSpan.innerText = track.name;
      totalSpan.innerText = track.duration ? format(track.duration) : '0:00';

      updateArtworkDisplay(track.coverUrl);
      updateMediaSession(track);

      try {
        await audio.play();
        isPlaying = true;
        playBtn.innerText = '⏸';
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
      } catch(e) { console.warn(e); }
      isSwitching = false;
      updateAllTrackHighlights();
    }

    function pauseTrack() {
      audio.pause();
      isPlaying = false;
      playBtn.innerText = '▶';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    }

    function togglePlay() {
      if (isPlaying) pauseTrack();
      else {
        if (!audio.src || audio.paused) playCurrent();
        else {
          audio.play().catch(console.warn);
          isPlaying = true;
          playBtn.innerText = '⏸';
          if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        }
      }
    }

    function nextTrack() { changeTrack(1); }
    function prevTrack() { changeTrack(-1); }

    function changeTrack(d) {
      let pl = playlists.get(activePl);
      if (!pl || !pl.ids.length) return;
      if (isSwitching) return;
      isSwitching = true;
      let newIdx = currentIdx + d;
      if (newIdx < 0) newIdx = pl.ids.length - 1;
      if (newIdx >= pl.ids.length) newIdx = 0;
      currentIdx = newIdx;
      audio.pause();
      audio.src = '';
      playCurrent().finally(() => { isSwitching = false; });
    }

    function seekTo(percent) {
      if (audio.duration) audio.currentTime = audio.duration * percent;
    }

    function updateMediaSession(track) {
      if (!('mediaSession' in navigator)) return;
      const artworkUrl = track.coverUrl || DEFAULT_COVER;
      const artwork = [{ src: artworkUrl, sizes: '512x512', type: 'image/png' }];
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.name,
        artist: 'Исполнитель',
        album: 'Плейлист',
        artwork: artwork
      });
    }

    function setupMediaSessionHandlers() {
      if (!('mediaSession' in navigator)) return;
      // Основные действия
      navigator.mediaSession.setActionHandler('play', () => togglePlay());
      navigator.mediaSession.setActionHandler('pause', () => togglePlay());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
      navigator.mediaSession.setActionHandler('stop', () => pauseTrack());
      // Жизненно важно: переопределяем перемотку пустыми функциями (не null!)
      navigator.mediaSession.setActionHandler('seekforward', () => {});
      navigator.mediaSession.setActionHandler('seekbackward', () => {});
    }

    let wasPlayingBeforeHidden = false;
    function handleVisibilityChange() {
      if (document.visibilityState === 'hidden') {
        wasPlayingBeforeHidden = isPlaying;
      } else if (document.visibilityState === 'visible') {
        if (wasPlayingBeforeHidden && !isPlaying) {
          audio.play().catch(console.warn);
          isPlaying = true;
          playBtn.innerText = '⏸';
          if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        }
        wasPlayingBeforeHidden = false;
      }
    }

    let progressAnimation;
    function startProgress() {
      if (progressAnimation) cancelAnimationFrame(progressAnimation);
      function update() {
        if (audio.duration && !isNaN(audio.duration)) {
          let percent = (audio.currentTime / audio.duration) * 100;
          fill.style.width = Math.min(100, percent) + '%';
          curTimeSpan.innerText = format(audio.currentTime);
          if (totalSpan.innerText === '0:00' && audio.duration) {
            totalSpan.innerText = format(audio.duration);
            let pl = playlists.get(activePl);
            if (pl && pl.ids[currentIdx]) {
              let t = tracks.find(tr => tr.id === pl.ids[currentIdx]);
              if (t && !t.duration) t.duration = audio.duration;
            }
          }
        }
        progressAnimation = requestAnimationFrame(update);
      }
      update();
    }
    startProgress();

    function bindAudioEvents() {
      audio.addEventListener('ended', () => { if (!isSwitching) nextTrack(); });
      audio.addEventListener('loadedmetadata', () => {
        totalSpan.innerText = format(audio.duration);
        let pl = playlists.get(activePl);
        if (pl && pl.ids[currentIdx]) {
          let t = tracks.find(tr => tr.id === pl.ids[currentIdx]);
          if (t && !t.duration) t.duration = audio.duration;
        }
      });
    }

    function renderSimpleTracksMenu() {
      let pl = playlists.get(activePl);
      if (!pl || !pl.ids.length) { tracksDropdown.innerHTML = '<div style="padding:12px">Нет треков</div>'; return; }
      tracksDropdown.innerHTML = '';
      pl.ids.forEach((tid, i) => {
        let t = tracks.find(tr => tr.id === tid);
        if (!t) return;
        let row = document.createElement('div');
        row.className = 'track-row' + (currentTrackId === tid ? ' now' : '');
        row.innerHTML = `<span>${t.name}</span><span>${t.duration ? format(t.duration) : '--:--'}</span>`;
        row.addEventListener('click', () => {
          if (isSwitching) return;
          isSwitching = true;
          audio.pause();
          audio.src = '';
          currentIdx = i;
          playCurrent().finally(() => { isSwitching = false; });
          tracksDropdown.classList.remove('show');
        });
        tracksDropdown.appendChild(row);
      });
    }

    function renderPlaylistsUI() {
      playlistListDiv.innerHTML = '';
      for (let [id, pl] of playlists) {
        let div = document.createElement('div');
        div.className = 'pl-item' + (activePl === id ? ' active' : '');
        div.innerHTML = `<span>${pl.name}</span>${id !== 'default' ? '<button data-del="true">🗑</button>' : ''}`;
        div.addEventListener('click', (e) => {
          if (e.target.tagName === 'BUTTON') return;
          if (isSwitching) return;
          isSwitching = true;
          activePl = id;
          currentIdx = 0;
          audio.pause();
          audio.src = '';
          playCurrent().finally(() => { isSwitching = false; });
          renderPlaylistsUI();
          renderTracksInSettings();
          renderSimpleTracksMenu();
        });
        if (id !== 'default') {
          let delBtn = div.querySelector('button');
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            playlists.delete(id);
            if (activePl === id) activePl = 'default';
            renderPlaylistsUI();
            renderTracksInSettings();
            renderSimpleTracksMenu();
          });
        }
        playlistListDiv.appendChild(div);
      }
    }

    function renderTracksInSettings() {
      let pl = playlists.get(activePl);
      if (!pl) return;
      trackDropdownList.innerHTML = '';
      pl.ids.forEach((tid, i) => {
        let t = tracks.find(tr => tr.id === tid);
        if (!t) return;
        let row = document.createElement('div');
        row.className = 'track-row' + (currentTrackId === tid ? ' now' : '');
        row.innerHTML = `<span>${t.name}</span><span>${t.duration ? format(t.duration) : '--:--'}</span>`;
        row.addEventListener('click', () => {
          if (isSwitching) return;
          isSwitching = true;
          audio.pause();
          audio.src = '';
          currentIdx = i;
          playCurrent().finally(() => { isSwitching = false; });
          settingsDropdown.classList.remove('show');
        });
        trackDropdownList.appendChild(row);
      });
    }

    function updateAllTrackHighlights() {
      let pl = playlists.get(activePl);
      if (!pl) return;
      let rowsSimple = tracksDropdown.children;
      for (let i = 0; i < rowsSimple.length; i++) {
        let tid = pl.ids[i];
        if (tid === currentTrackId) rowsSimple[i].classList.add('now');
        else rowsSimple[i].classList.remove('now');
      }
      let rowsSettings = trackDropdownList.children;
      for (let i = 0; i < rowsSettings.length; i++) {
        let tid = pl.ids[i];
        if (tid === currentTrackId) rowsSettings[i].classList.add('now');
        else rowsSettings[i].classList.remove('now');
      }
    }

    async function addTrackFromUrl(name, url, coverUrl = null) {
      let id = nextId++;
      let duration = 0;
      try {
        let testAudio = new Audio();
        testAudio.src = url;
        await new Promise((resolve) => {
          testAudio.addEventListener('loadedmetadata', () => { duration = testAudio.duration; resolve(); });
          testAudio.addEventListener('error', () => resolve());
        });
      } catch(e) {}
      tracks.push({ id, name, url, coverUrl, duration });
      let pl = playlists.get(activePl);
      if (pl) pl.ids.push(id);
      renderPlaylistsUI();
      renderTracksInSettings();
      renderSimpleTracksMenu();
      if (!currentTrackId && tracks.length) {
        currentIdx = 0;
        playCurrent();
      }
    }

    async function handleUserFiles(files) {
      let audioFiles = files.filter(f => f.type.startsWith('audio/'));
      let imageFiles = files.filter(f => f.type.startsWith('image/'));
      for (let af of audioFiles) {
        let url = URL.createObjectURL(af);
        let name = af.name.replace(/\.[^/.]+$/, '');
        let coverUrl = null;
        let baseName = af.name.substring(0, af.name.lastIndexOf('.'));
        let matchImg = imageFiles.find(img => img.name.startsWith(baseName) && /\.(jpg|jpeg|png)$/i.test(img.name));
        if (matchImg) {
          coverUrl = URL.createObjectURL(matchImg);
          imageFiles = imageFiles.filter(img => img !== matchImg);
        }
        await addTrackFromUrl(name, url, coverUrl);
      }
    }

    async function loadMusicViaManifest(path = 'music/manifest.json') {
      try {
        let r = await fetch(path);
        if (!r.ok) throw new Error();
        let json = await r.json();
        let files = json.tracks || [];
        for (let f of files) {
          let url = f.startsWith('http') ? f : `music/${f}`;
          let name = f.split('/').pop().replace(/\.[^/.]+$/, '');
          let coverUrl = (json.covers && json.covers[f]) ? json.covers[f] : null;
          await addTrackFromUrl(name, url, coverUrl);
        }
      } catch(e) { console.log('manifest not loaded'); }
    }

    async function generateManifest() {
      if (!window.showDirectoryPicker) { alert('Браузер не поддерживает выбор папки'); return; }
      try {
        let dir = await window.showDirectoryPicker();
        let audioList = [];
        async function scan(h, path = '') {
          for await (let e of h.values()) {
            if (e.kind === 'file' && /\.(mp3|wav|ogg|flac|m4a)$/i.test(e.name)) audioList.push(path ? `${path}/${e.name}` : e.name);
            else if (e.kind === 'directory') await scan(e, path ? `${path}/${e.name}` : e.name);
          }
        }
        await scan(dir);
        if (!audioList.length) { alert('Нет аудио'); return; }
        let blob = new Blob([JSON.stringify({ tracks: audioList }, null, 2)], { type: 'application/json' });
        let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'manifest.json'; a.click(); URL.revokeObjectURL(blob);
        alert(`✅ manifest.json (${audioList.length} треков) сохранён`);
      } catch(e) { alert('Ошибка: ' + e.message); }
    }

    function bindEvents() {
      playBtn.onclick = togglePlay;
      prevBtn.onclick = prevTrack;
      nextBtn.onclick = nextTrack;
      progressBar.addEventListener('click', (e) => {
        let rect = progressBar.getBoundingClientRect();
        let per = (e.clientX - rect.left) / rect.width;
        seekTo(per);
      });
      volumeSlider.oninput = (e) => setVolume(parseFloat(e.target.value));
      tracksListBtn.onclick = (e) => {
        e.stopPropagation();
        tracksDropdown.classList.toggle('show');
        settingsDropdown.classList.remove('show');
        renderSimpleTracksMenu();
      };
      settingsBtn.onclick = (e) => {
        e.stopPropagation();
        settingsDropdown.classList.toggle('show');
        tracksDropdown.classList.remove('show');
      };
      document.addEventListener('click', (e) => {
        if (!tracksListBtn.contains(e.target) && !tracksDropdown.contains(e.target)) tracksDropdown.classList.remove('show');
        if (!settingsBtn.contains(e.target) && !settingsDropdown.contains(e.target)) settingsDropdown.classList.remove('show');
      });
      newPlBtn.onclick = () => { let nm = prompt('Название плейлиста'); if (nm) playlists.set('pl_' + Date.now(), { name: nm, ids: [] }); renderPlaylistsUI(); renderSimpleTracksMenu(); };
      uploadBtn.onclick = () => fileInput.click();
      fileInput.onchange = (e) => { if (e.target.files.length) handleUserFiles(Array.from(e.target.files)); fileInput.value = ''; };
      genManifestBtn.onclick = generateManifest;
      window.addEventListener('dragover', e => e.preventDefault());
      window.addEventListener('drop', async e => { e.preventDefault(); let fs = Array.from(e.dataTransfer.files); await handleUserFiles(fs); });
      document.addEventListener('visibilitychange', handleVisibilityChange);
    }

    window.addEventListener('load', async () => {
      let sv = localStorage.getItem('vol_set');
      if (sv) { volumeSlider.value = sv; setVolume(+sv); } else setVolume(volumeSlider.value);
      bindEvents();
      bindAudioEvents();
      setupMediaSessionHandlers();
      await loadMusicViaManifest('music/manifest.json');
      if (!tracks.length) await loadMusicViaManifest('manifest.json');
      renderPlaylistsUI();
      renderTracksInSettings();
      renderSimpleTracksMenu();
    });
  })();
</script>
</body>
</html>
