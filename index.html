<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>iPod · плеер с Media Session</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 30% 20%, #121212, #000000);
      font-family: system-ui, -apple-system, 'SF Pro Text', Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .player-card {
      background: rgba(20, 22, 28, 0.85);
      backdrop-filter: blur(40px);
      border-radius: 48px;
      padding: 24px 20px 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .icon-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #ddd;
      padding: 8px;
      border-radius: 40px;
      transition: 0.1s;
    }
    .icon-btn:active { background: rgba(255,255,255,0.1); }

    .artwork {
      aspect-ratio: 1 / 1;
      width: 85%;
      margin: 0 auto 20px;
      background: linear-gradient(145deg, #2c2e36, #1a1c22);
      border-radius: 24px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 3rem;
    }

    .track-info {
      text-align: center;
      margin: 16px 0 10px;
    }
    .track-name {
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .track-artist {
      font-size: 0.9rem;
      color: #bcbcbc;
      margin-top: 4px;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 12px;
      font-size: 0.75rem;
      color: #bbb;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: #3a3e48;
      border-radius: 10px;
      cursor: pointer;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #fa6b6b;
      border-radius: 10px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin: 12px 0 10px;
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      width: 70px;
      height: 70px;
      border-radius: 70px;
      font-size: 2.2rem;
      cursor: pointer;
      color: white;
      transition: 0.1s;
    }
    .ctrl-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.2); }
    .play-btn { background: #fa6b6b; box-shadow: 0 8px 20px rgba(250, 107, 107, 0.3); }

    .dropdown {
      position: absolute;
      background: rgba(30, 32, 40, 0.98);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 100;
      display: none;
      flex-direction: column;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
    }
    .dropdown.show { display: flex; }

    .tracks-dropdown {
      left: 10px;
      top: 60px;
      width: 260px;
      max-height: 400px;
      overflow-y: auto;
      padding: 12px;
      gap: 8px;
    }
    .track-row {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .track-row.now { background: #fa6b6b80; }

    .settings-dropdown {
      right: 0;
      top: 60px;
      width: 500px;
      max-width: 90vw;
      padding: 18px;
      gap: 18px;
    }
    .playlist-track-panel {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 16px;
      min-height: 280px;
    }
    .playlist-side, .tracks-side {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 24px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .playlist-side h4, .tracks-side h4 {
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 10px;
    }
    .playlist-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pl-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .pl-item.active { background: #fa6b6b; color: white; }
    .pl-item button {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
    }
    .track-list-drop {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .small-btn {
      background: #2c6e9e;
      border: none;
      padding: 6px;
      border-radius: 40px;
      color: white;
      margin-top: 12px;
      font-size: 0.75rem;
      cursor: pointer;
      width: 100%;
    }
    .eq-sliders {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .eq-sliders div { flex: 1; text-align: center; }
    .eq-sliders input { width: 100%; }
    .preset-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .preset-btn {
      background: #2c2f3a;
      border: none;
      padding: 4px 12px;
      border-radius: 30px;
      color: white;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .volume-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }
    .volume-slider { flex: 1; }
    .upload-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    @media (max-width: 560px) {
      .settings-dropdown { width: 96vw; right: -10px; }
      .playlist-track-panel { grid-template-columns: 1fr; gap: 12px; max-height: 400px; overflow-y: auto; }
      .ctrl-btn { width: 60px; height: 60px; font-size: 1.8rem; }
      .track-name { font-size: 1.3rem; }
    }
  </style>
</head>
<body oncontextmenu="return false">
<div class="player-card">
  <div class="top-bar">
    <button class="icon-btn" id="tracksListBtn">🎵</button>
    <button class="icon-btn" id="settingsBtn">⚙️</button>
  </div>

  <div id="tracksDropdown" class="dropdown tracks-dropdown"></div>
  <div id="settingsDropdown" class="dropdown settings-dropdown">
    <div class="playlist-track-panel">
      <div class="playlist-side">
        <h4>📀 Плейлисты</h4>
        <div id="playlistList" class="playlist-list"></div>
        <button id="newPlBtn" class="small-btn">+ Новый плейлист</button>
      </div>
      <div class="tracks-side">
        <h4>🎧 Треки в плейлисте</h4>
        <div id="trackDropdownList" class="track-list-drop"></div>
      </div>
    </div>
    <div class="eq-section">
      <div class="eq-sliders">
        <div><label>Bass</label><input type="range" id="bassGain" min="-12" max="12" value="0" step="0.5"><div id="bassVal">0</div></div>
        <div><label>Mid</label><input type="range" id="midGain" min="-12" max="12" value="0" step="0.5"><div id="midVal">0</div></div>
        <div><label>Treble</label><input type="range" id="trebleGain" min="-12" max="12" value="0" step="0.5"><div id="trebleVal">0</div></div>
      </div>
      <div class="preset-row">
        <button class="preset-btn" data-preset="flat">Flat</button>
        <button class="preset-btn" data-preset="rock">Rock</button>
        <button class="preset-btn" data-preset="pop">Pop</button>
        <button class="preset-btn" data-preset="jazz">Jazz</button>
      </div>
      <div class="volume-row">
        <span>🔊</span><input type="range" id="volumeCtl" min="0" max="1" step="0.01" value="0.8" class="volume-slider">
      </div>
      <div class="upload-row">
        <button id="uploadMusicBtn" class="small-btn" style="background:#3a5668">📁 Загрузить музыку</button>
        <button id="genManifestBtn" class="small-btn" style="background:#3a5668">📄 Создать manifest.json</button>
      </div>
      <input type="file" id="fileInput" multiple accept="audio/*" style="display:none">
    </div>
  </div>

  <div class="artwork" id="artwork"><span>🎵</span></div>
  <div class="track-info">
    <div class="track-name" id="currentTrackName">—</div>
    <div class="track-artist">не выбрано</div>
  </div>
  <div class="progress-container">
    <span id="currentTimeLabel">0:00</span>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="totalDurationLabel">0:00</span>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn">⏮</button>
    <button class="ctrl-btn play-btn" id="playPauseBtn">▶</button>
    <button class="ctrl-btn" id="nextBtn">⏭</button>
  </div>
</div>

<script>
  (function(){
    // --- Аудио ---
    let ctx = null, playing = false, source = null, buffer = null, trackId = null;
    let startTime = 0, pauseOffset = 0;
    let tracks = [];         // { id, name, buf, duration }
    let nextId = 1;
    let playlists = new Map([['default', { name: 'Основной', ids: [] }]]);
    let activePl = 'default', currentIdx = 0;
    let bass, mid, treble, gain, analyser;
    let animFrame = null;
    let isEnding = false;     // блокируем повторный вызов onended
    let isSwitching = false;  // блокируем переключение во время ручного

    // --- Media Session API ---
    function updateMediaSessionMetadata(trackName, artistName = 'Альбом') {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: trackName,
          artist: artistName,
          album: 'Альбом',
          artwork: []
        });
      }
    }

    function setMediaSessionPlaybackState(state) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = state;
      }
    }

    function setupMediaSessionHandlers() {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.setActionHandler('play', () => {
        togglePlay();
      });
      navigator.mediaSession.setActionHandler('pause', () => {
        togglePlay();
      });
      navigator.mediaSession.setActionHandler('nexttrack', () => {
        nextTrack();
      });
      navigator.mediaSession.setActionHandler('previoustrack', () => {
        prevTrack();
      });
    }

    // DOM
    const playBtn = document.getElementById('playPauseBtn'), prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar'), fill = document.getElementById('progressFill');
    const curTimeSpan = document.getElementById('currentTimeLabel'), totalSpan = document.getElementById('totalDurationLabel');
    const trackNameSpan = document.getElementById('currentTrackName');
    const bassSl = document.getElementById('bassGain'), midSl = document.getElementById('midGain'), trebleSl = document.getElementById('trebleGain');
    const bassVal = document.getElementById('bassVal'), midVal = document.getElementById('midVal'), trebleVal = document.getElementById('trebleVal');
    const volumeSlider = document.getElementById('volumeCtl');
    const tracksListBtn = document.getElementById('tracksListBtn'), settingsBtn = document.getElementById('settingsBtn');
    const tracksDropdown = document.getElementById('tracksDropdown');
    const settingsDropdown = document.getElementById('settingsDropdown');
    const playlistListDiv = document.getElementById('playlistList');
    const trackDropdownList = document.getElementById('trackDropdownList');
    const newPlBtn = document.getElementById('newPlBtn');
    const uploadBtn = document.getElementById('uploadMusicBtn'), fileInput = document.getElementById('fileInput');
    const genManifestBtn = document.getElementById('genManifestBtn');

    function format(sec) { let m = Math.floor(sec/60), s = Math.floor(sec%60); return `${m}:${s<10?'0':''}${s}`; }

    function initAudio() {
      if(ctx && ctx.state !== 'closed') return ctx;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      gain = ctx.createGain(); analyser = ctx.createAnalyser(); analyser.fftSize = 256;
      gain.gain.value = parseFloat(volumeSlider.value);
      bass = ctx.createBiquadFilter(); bass.type = "lowshelf"; bass.frequency.value = 200;
      mid = ctx.createBiquadFilter(); mid.type = "peaking"; mid.frequency.value = 1000;
      treble = ctx.createBiquadFilter(); treble.type = "highshelf"; treble.frequency.value = 5000;
      bass.connect(mid); mid.connect(treble); treble.connect(gain); gain.connect(analyser); analyser.connect(ctx.destination);
      return ctx;
    }
    function updateEq() {
      if(!bass) return;
      bass.gain.value = parseFloat(bassSl.value);
      mid.gain.value = parseFloat(midSl.value);
      treble.gain.value = parseFloat(trebleSl.value);
      bassVal.innerText = bass.gain.value+' dB'; midVal.innerText = mid.gain.value+' dB'; trebleVal.innerText = treble.gain.value+' dB';
      localStorage.setItem('eq_set', JSON.stringify({b:bassSl.value, m:midSl.value, t:trebleSl.value}));
    }
    function loadEq() { let s = localStorage.getItem('eq_set'); if(s){ let v=JSON.parse(s); bassSl.value=v.b; midSl.value=v.m; trebleSl.value=v.t; } updateEq(); }
    function setVolume(v) { if(gain) gain.gain.value = v; localStorage.setItem('vol_set', v); }
    function applyPreset(p) { let m = { flat:{b:0,m:0,t:0}, rock:{b:5,m:-2,t:4}, pop:{b:3,m:1,t:3}, jazz:{b:4,m:2,t:1} }; let v = m[p] || m.flat; bassSl.value=v.b; midSl.value=v.m; trebleSl.value=v.t; updateEq(); }

    // Безопасная остановка источника
    function stopSource() {
      if(source) {
        try {
          source.onended = null;   // отключаем обработчик, чтобы он не вызвался после остановки
          source.stop();
        } catch(e) {}
        source = null;
      }
    }

    async function playCurrent() {
      if(!ctx) initAudio();
      if(ctx.state === 'suspended') await ctx.resume();

      let pl = playlists.get(activePl);
      if(!pl || !pl.ids.length) return;
      let tr = tracks.find(t => t.id === pl.ids[currentIdx]);
      if(!tr || !tr.buf) return;

      stopSource(); // останавливаем старый источник, сброс onended

      buffer = tr.buf;
      trackId = tr.id;
      trackNameSpan.innerText = tr.name;
      totalSpan.innerText = format(buffer.duration);
      updateAllTrackHighlights();

      // Обновляем Media Session
      updateMediaSessionMetadata(tr.name);
      setMediaSessionPlaybackState('playing');

      source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(bass);
      // Обработчик окончания с защитой от повторных вызовов
      source.onended = () => {
        if(!isEnding && !isSwitching && playing) {
          isEnding = true;
          nextTrack();
          setTimeout(() => { isEnding = false; }, 100);
        }
      };
      source.start(0, pauseOffset);
      startTime = ctx.currentTime - pauseOffset;
      playing = true;
      playBtn.innerText = '⏸';
      pauseOffset = 0;
      startProgress();
    }

    function pauseTrack() {
      if(!playing || !source) return;
      let elapsed = ctx.currentTime - startTime;
      pauseOffset = Math.max(0, elapsed);
      stopSource();
      playing = false;
      playBtn.innerText = '▶';
      setMediaSessionPlaybackState('paused');
    }

    function togglePlay() {
      if(!ctx) initAudio();
      if(playing) pauseTrack();
      else {
        if(!buffer && tracks.length){
          let pl = playlists.get(activePl);
          if(pl && pl.ids.length) { currentIdx=0; pauseOffset=0; playCurrent(); }
        } else if(buffer) playCurrent();
      }
    }

    function nextTrack() { changeTrack(1); }
    function prevTrack() { changeTrack(-1); }

    function changeTrack(d) {
      let pl = playlists.get(activePl);
      if(!pl || !pl.ids.length) return;
      if(isSwitching) return;
      isSwitching = true;
      stopSource();  // очищаем текущий источник и отключаем onended
      playing = false;
      pauseOffset = 0;
      let newIdx = currentIdx + d;
      if(newIdx < 0) newIdx = pl.ids.length - 1;
      if(newIdx >= pl.ids.length) newIdx = 0;
      currentIdx = newIdx;
      playCurrent().finally(() => {
        isSwitching = false;
      });
    }

    function seek(percent) {
      if(!buffer) return;
      let newPos = buffer.duration * percent;
      let wasPlaying = playing;
      if(playing && source) {
        pauseTrack();
        pauseOffset = newPos;
        if(wasPlaying) playCurrent();
      } else {
        pauseOffset = newPos;
      }
    }

    function startProgress() {
      if(animFrame) cancelAnimationFrame(animFrame);
      function update(){
        if(buffer){
          let cur = pauseOffset;
          if(playing && source && startTime) cur = ctx.currentTime - startTime;
          let percent = (cur / buffer.duration) * 100;
          fill.style.width = Math.min(100, percent)+'%';
          curTimeSpan.innerText = format(cur);
        }
        animFrame = requestAnimationFrame(update);
      }
      update();
    }

    // --- Рендер меню (без изменений, но добавим флаг isSwitching)---
    function renderSimpleTracksMenu() {
      let pl = playlists.get(activePl);
      if(!pl) { tracksDropdown.innerHTML = '<div style="padding:12px">Нет треков</div>'; return; }
      tracksDropdown.innerHTML = '';
      pl.ids.forEach((tid, i) => {
        let t = tracks.find(tr => tr.id === tid);
        if(!t) return;
        let row = document.createElement('div');
        row.className = 'track-row' + (trackId === tid ? ' now' : '');
        row.innerHTML = `<span>${t.name}</span><span>${format(t.duration)}</span>`;
        row.addEventListener('click', () => {
          if(isSwitching) return;
          isSwitching = true;
          stopSource();
          playing = false; pauseOffset = 0;
          currentIdx = i;
          playCurrent().finally(() => { isSwitching = false; });
          tracksDropdown.classList.remove('show');
        });
        tracksDropdown.appendChild(row);
      });
    }
    function renderPlaylistsUI() {
      playlistListDiv.innerHTML = '';
      for(let [id, pl] of playlists){
        let div = document.createElement('div');
        div.className = 'pl-item' + (activePl === id ? ' active' : '');
        div.innerHTML = `<span>${pl.name}</span>${id !== 'default' ? '<button data-del="true">🗑</button>' : ''}`;
        div.addEventListener('click', (e) => {
          if(e.target.tagName === 'BUTTON') return;
          if(isSwitching) return;
          isSwitching = true;
          activePl = id;
          currentIdx = 0; pauseOffset = 0;
          stopSource();
          playing = false; playBtn.innerText = '▶';
          renderPlaylistsUI();
          renderTracksInSettings();
          renderSimpleTracksMenu();
          let plData = playlists.get(activePl);
          if(plData && plData.ids.length){
            let first = tracks.find(t=>t.id === plData.ids[0]);
            if(first){ buffer = first.buf; trackId = first.id; trackNameSpan.innerText = first.name; totalSpan.innerText = format(first.duration); pauseOffset=0; }
            else { buffer=null; trackNameSpan.innerText='—'; totalSpan.innerText='0:00'; }
          } else { buffer=null; trackNameSpan.innerText='—'; totalSpan.innerText='0:00'; }
          updateAllTrackHighlights();
          isSwitching = false;
        });
        if(id !== 'default'){
          let delBtn = div.querySelector('button');
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            playlists.delete(id);
            if(activePl === id) activePl = 'default';
            renderPlaylistsUI();
            renderTracksInSettings();
            renderSimpleTracksMenu();
          });
        }
        playlistListDiv.appendChild(div);
      }
    }
    function renderTracksInSettings() {
      let pl = playlists.get(activePl);
      if(!pl) return;
      trackDropdownList.innerHTML = '';
      pl.ids.forEach((tid, i) => {
        let t = tracks.find(tr => tr.id === tid);
        if(!t) return;
        let row = document.createElement('div');
        row.className = 'track-row' + (trackId === tid ? ' now' : '');
        row.innerHTML = `<span>${t.name}</span><span>${format(t.duration)}</span>`;
        row.addEventListener('click', () => {
          if(isSwitching) return;
          isSwitching = true;
          stopSource();
          playing = false; pauseOffset = 0;
          currentIdx = i;
          playCurrent().finally(() => { isSwitching = false; });
          settingsDropdown.classList.remove('show');
        });
        trackDropdownList.appendChild(row);
      });
    }
    function updateAllTrackHighlights() {
      let pl = playlists.get(activePl);
      if(!pl) return;
      let rowsSimple = tracksDropdown.children;
      for(let i=0; i<rowsSimple.length; i++){
        let tid = pl.ids[i];
        if(tid === trackId) rowsSimple[i].classList.add('now');
        else rowsSimple[i].classList.remove('now');
      }
      let rowsSettings = trackDropdownList.children;
      for(let i=0; i<rowsSettings.length; i++){
        let tid = pl.ids[i];
        if(tid === trackId) rowsSettings[i].classList.add('now');
        else rowsSettings[i].classList.remove('now');
      }
    }

    // --- Загрузка треков ---
    async function addTrackFromUrl(name, url, buf=null){
      if(!buf){
        if(!ctx) initAudio();
        let r = await fetch(url);
        if(!r.ok) throw new Error();
        let ab = await r.arrayBuffer();
        buf = await ctx.decodeAudioData(ab);
      }
      let id = nextId++;
      tracks.push({id, name, buf, duration: buf.duration});
      let pl = playlists.get(activePl);
      if(pl) pl.ids.push(id);
      renderPlaylistsUI();
      renderTracksInSettings();
      renderSimpleTracksMenu();
      if(!buffer && tracks.length){
        let f = tracks[0];
        buffer = f.buf; trackId = f.id; trackNameSpan.innerText = f.name; totalSpan.innerText = format(f.duration); pauseOffset=0;
      }
    }
    async function loadMusicViaManifest(path='music/manifest.json'){
      try{
        let r = await fetch(path);
        if(!r.ok) throw new Error();
        let json = await r.json();
        let files = json.tracks || [];
        for(let f of files){
          let url = f.startsWith('http') ? f : `music/${f}`;
          let name = f.split('/').pop().replace(/\.[^/.]+$/,'');
          await addTrackFromUrl(name, url);
        }
      }catch(e){ console.log('manifest not loaded'); }
    }
    async function handleUserFiles(files){
      if(!ctx) initAudio();
      for(let f of files){
        if(f.type.startsWith('audio/')){
          let ab = await f.arrayBuffer();
          let buf = await ctx.decodeAudioData(ab);
          let name = f.name.replace(/\.[^/.]+$/,'');
          let id = nextId++;
          tracks.push({id, name, buf, duration: buf.duration});
          let pl = playlists.get(activePl);
          if(pl) pl.ids.push(id);
        }
      }
      renderPlaylistsUI(); renderTracksInSettings(); renderSimpleTracksMenu();
      if(!buffer && tracks.length){ let ft = tracks[0]; buffer=ft.buf; trackId=ft.id; trackNameSpan.innerText=ft.name; totalSpan.innerText=format(ft.duration); pauseOffset=0; }
      updateAllTrackHighlights();
    }
    async function generateManifest(){
      if(!window.showDirectoryPicker){ alert('Браузер не поддерживает выбор папки'); return; }
      try{
        let dir = await window.showDirectoryPicker();
        let audioList = [];
        async function scan(h, path=''){
          for await(let e of h.values()){
            if(e.kind === 'file' && /\.(mp3|wav|ogg|flac|m4a)$/i.test(e.name)) audioList.push(path ? `${path}/${e.name}` : e.name);
            else if(e.kind === 'directory') await scan(e, path ? `${path}/${e.name}` : e.name);
          }
        }
        await scan(dir);
        if(!audioList.length){ alert('Нет аудио'); return; }
        let blob = new Blob([JSON.stringify({tracks: audioList}, null, 2)], {type:'application/json'});
        let a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='manifest.json'; a.click(); URL.revokeObjectURL(blob);
        alert(`✅ manifest.json (${audioList.length} треков)`);
      }catch(e){ alert('Ошибка: '+e.message); }
    }

    // --- Фоновое воспроизведение на iOS + Media Session ---
    let wasPlayingBeforeHidden = false;
    let savedPauseOffset = 0;
    function handleVisibilityChange() {
      if(document.visibilityState === 'hidden') {
        wasPlayingBeforeHidden = playing;
        if(playing && ctx && ctx.state !== 'closed') {
          if(source && startTime) {
            savedPauseOffset = ctx.currentTime - startTime;
          } else {
            savedPauseOffset = pauseOffset;
          }
        }
      } else if(document.visibilityState === 'visible') {
        if(wasPlayingBeforeHidden && ctx) {
          if(ctx.state === 'suspended') {
            ctx.resume().then(() => {
              if(!playing && buffer && savedPauseOffset >= 0) {
                pauseOffset = savedPauseOffset;
                playCurrent();
              }
            }).catch(console.warn);
          } else {
            if(!playing && buffer && savedPauseOffset >= 0) {
              pauseOffset = savedPauseOffset;
              playCurrent();
            }
          }
        }
        wasPlayingBeforeHidden = false;
        savedPauseOffset = 0;
      }
    }

    // --- События ---
    function bindEvents(){
      playBtn.onclick = togglePlay;
      prevBtn.onclick = prevTrack;
      nextBtn.onclick = nextTrack;
      progressBar.addEventListener('click', (e) => { let rect = progressBar.getBoundingClientRect(); let per = (e.clientX - rect.left)/rect.width; if(buffer) seek(per); });
      volumeSlider.oninput = (e) => setVolume(parseFloat(e.target.value));
      
      tracksListBtn.onclick = (e) => {
        e.stopPropagation();
        tracksDropdown.classList.toggle('show');
        settingsDropdown.classList.remove('show');
        renderSimpleTracksMenu();
      };
      settingsBtn.onclick = (e) => {
        e.stopPropagation();
        settingsDropdown.classList.toggle('show');
        tracksDropdown.classList.remove('show');
      };
      document.addEventListener('click', (e) => {
        if(!tracksListBtn.contains(e.target) && !tracksDropdown.contains(e.target)) tracksDropdown.classList.remove('show');
        if(!settingsBtn.contains(e.target) && !settingsDropdown.contains(e.target)) settingsDropdown.classList.remove('show');
      });
      
      bassSl.oninput = updateEq; midSl.oninput = updateEq; trebleSl.oninput = updateEq;
      document.querySelectorAll('.preset-btn').forEach(b => b.addEventListener('click', () => applyPreset(b.dataset.preset)));
      newPlBtn.onclick = () => { let nm = prompt('Название плейлиста'); if(nm) playlists.set('pl_'+Date.now(), { name: nm, ids: [] }); renderPlaylistsUI(); renderSimpleTracksMenu(); };
      uploadBtn.onclick = () => fileInput.click();
      fileInput.onchange = (e) => { if(e.target.files.length) handleUserFiles(Array.from(e.target.files)); fileInput.value=''; };
      genManifestBtn.onclick = generateManifest;
      window.addEventListener('dragover', e=>e.preventDefault());
      window.addEventListener('drop', async e=>{ e.preventDefault(); let fs = Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('audio/')); if(fs.length) await handleUserFiles(fs); });
      document.addEventListener('visibilitychange', handleVisibilityChange);

      // Инициализация Media Session обработчиков
      setupMediaSessionHandlers();
    }

    window.addEventListener('load', async()=>{
      initAudio(); loadEq(); let sv = localStorage.getItem('vol_set'); if(sv){ volumeSlider.value = sv; setVolume(+sv); } else setVolume(volumeSlider.value);
      bindEvents();
      await loadMusicViaManifest('music/manifest.json');
      if(!tracks.length) await loadMusicViaManifest('manifest.json');
      renderPlaylistsUI(); renderTracksInSettings(); renderSimpleTracksMenu();
      if(tracks.length && !buffer){
        let firstPl = playlists.get(activePl);
        if(firstPl && firstPl.ids.length){
          let firstTrack = tracks.find(t=>t.id===firstPl.ids[0]);
          if(firstTrack){ buffer=firstTrack.buf; trackId=firstTrack.id; trackNameSpan.innerText=firstTrack.name; totalSpan.innerText=format(firstTrack.duration); }
        }
      }
      startProgress();
    });
  })();
</script>
</body>
</html>
